services:
  autochat:
    build: .
    restart: unless-stopped
    init: true
    environment:
      PANEL_PASSWORD: ${PANEL_PASSWORD:?请先运行 python3 setup.py 生成管理密码}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DATA_DIR: /app/data
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - autochat-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
volumes:
  autochat-data:
